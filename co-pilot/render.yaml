services:
  # Backend (FastAPI)
  - type: web
    name: govpilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: govpilot-db
          property: connectionString

  # Frontend (React + Vite)
  - type: web
    name: govpilot-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://govpilot-backend.onrender.com

databases:
  - name: govpilot-db
    databaseName: govpilot
    user: govpilot