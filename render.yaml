databases:
  - name: govpilot-db
    databaseName: govpilot
    user: govpilot_user
    plan: free

services:
  # ──────────────────────────────────────────
  # Backend — FastAPI + Uvicorn
  # ──────────────────────────────────────────
  - type: web
    name: govpilot-backend
    env: python
    plan: free
    rootDir: co-pilot/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: govpilot-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://govpilot-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ──────────────────────────────────────────
  # Frontend — React + Vite (Static Site)
  # ──────────────────────────────────────────
  - type: web
    name: govpilot-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://govpilot-backend.onrender.com
      - key: VITE_OPENAI_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GOOGLE_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
